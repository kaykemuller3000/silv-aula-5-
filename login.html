<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCD Motors — Entrar / Criar Perfil</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #f4f6f9; color:#14284b;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding: 40px 20px;
  }
  .card {
    background:#fff; border:1px solid #e2e6ee; border-radius:16px;
    padding: 40px; max-width: 480px; width:100%;
    box-shadow: 0 20px 50px rgba(20,40,80,.08);
  }
  .header { text-align: center; margin-bottom: 30px; }
  .header svg { width: 50px; height: 50px; color: #14284b; }
  h1 { font-size: 24px; margin-top: 15px; color: #14284b; }
  
  .tabs { display: flex; margin-bottom: 25px; border-bottom: 2px solid #e2e6ee; }
  .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: 600; color: #5b6577; }
  .tab.active { color: #1c5cff; border-bottom: 2px solid #1c5cff; margin-bottom: -2px; }

  .form-group { margin-bottom: 20px; }
  label { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 8px; color: #14284b; }
  input[type="text"], input[type="email"], select {
    width: 100%; padding: 12px 14px; border: 1px solid #c3cbdb; border-radius: 8px;
    font-size: 14.5px; background: #fff;
  }
  input:focus, select:focus { outline: none; border-color: #1c5cff; box-shadow: 0 0 0 3px rgba(28,92,255,.15); }
  
  .btn {
    width: 100%; padding: 14px; border: none; border-radius: 8px;
    background: #1c5cff; color: #fff; font-weight: 700; font-size: 15px;
    cursor: pointer; transition: background .2s; margin-top: 10px;
  }
  .btn:hover { background: #0f3fc2; }

  .hidden { display: none; }
  
  .helper-text { font-size: 12px; color: #5b6577; margin-top: 5px; }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <svg viewBox="0 0 64 64" fill="none">
      <path d="M47.4 33.3A18 18 0 1 1 36.2 21.1" stroke="currentColor" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M30 38 50 14" stroke="#0aab8f" stroke-width="7" stroke-linecap="round"/>
      <circle cx="30" cy="38" r="5.4" fill="currentColor"/>
    </svg>
    <h1>Bem-vindo à PCD Motors</h1>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-login" onclick="switchTab('login')">Entrar</div>
    <div class="tab" id="tab-register" onclick="switchTab('register')">Criar Perfil</div>
  </div>

  <!-- Formulário de Login -->
  <div id="form-login">
    <div class="form-group">
      <label for="login-nome">Como você quer ser chamado?</label>
      <input type="text" id="login-nome" placeholder="Seu nome ou apelido">
    </div>
    <button class="btn" onclick="fazerLogin()">Entrar na Plataforma</button>
  </div>

  <!-- Formulário de Registro/Perfil -->
  <div id="form-register" class="hidden">
    <div class="form-group">
      <label for="reg-nome">Nome Completo</label>
      <input type="text" id="reg-nome" placeholder="Ex: João da Silva">
    </div>
    
    <div class="form-group">
      <label for="reg-email">E-mail</label>
      <input type="email" id="reg-email" placeholder="seu@email.com">
    </div>

    <div class="form-group">
      <label for="reg-deficiencia">Tipo de Necessidade/Deficiência (Opcional)</label>
      <select id="reg-deficiencia">
        <option value="">Prefiro não informar / Não se aplica</option>
        <option value="membros_inferiores">Mobilidade reduzida nos membros inferiores</option>
        <option value="membros_superiores">Mobilidade reduzida nos membros superiores</option>
        <option value="cadeirante_transferencia">Usuário de cadeira de rodas (consegue fazer transferência)</option>
        <option value="cadeirante_dirige_cadeira">Usuário de cadeira de rodas (dirige na própria cadeira)</option>
        <option value="nanismo">Nanismo</option>
        <option value="hemiplegia">Hemiplegia / Paresia</option>
      </select>
      <div class="helper-text">Usamos essa informação apenas para recomendar as adaptações veiculares mais adequadas para o seu perfil.</div>
    </div>

    <button class="btn" onclick="criarPerfil()">Criar Meu Perfil</button>
  </div>

</div>

<script>
  function switchTab(tab) {
    document.getElementById('tab-login').classList.remove('active');
    document.getElementById('tab-register').classList.remove('active');
    document.getElementById('form-login').classList.add('hidden');
    document.getElementById('form-register').classList.add('hidden');

    document.getElementById('tab-' + tab).classList.add('active');
    document.getElementById('form-' + tab).classList.remove('hidden');
  }

  function mapearDeficienciaParaAdaptacao(deficiencia) {
    // Mapeia o tipo de deficiência para o filtro interno (chaves usadas no home.html)
    const mapa = {
      'membros_inferiores': 'comando', // Comando manual freio/acelerador
      'membros_superiores': 'direcao', // Direção assistida / pomo
      'cadeirante_transferencia': 'transferencia', // Banco de transferência / Embarque
      'cadeirante_dirige_cadeira': 'elevador', // Elevador / Plataforma
      'nanismo': 'pedais', // Prolongador de pedais (exemplo)
      'hemiplegia': 'embreagem' // Embreagem automatizada / pomo
    };
    return mapa[deficiencia] || null;
  }

  function fazerLogin() {
    const nome = document.getElementById('login-nome').value;
    if (!nome) { alert("Por favor, digite seu nome."); return; }
    
    // Salva o estado de login no Local Storage
    localStorage.setItem('pcd_userName', nome);
    localStorage.setItem('pcd_isLoggedIn', 'true');
    
    alert("Bem-vindo de volta, " + nome + "!");
    window.location.href = "home 1.html";
  }

  function criarPerfil() {
    const nome = document.getElementById('reg-nome').value;
    const deficiencia = document.getElementById('reg-deficiencia').value;
    
    if (!nome) { alert("Por favor, preencha seu nome."); return; }

    // Salva os dados do perfil
    localStorage.setItem('pcd_userName', nome);
    localStorage.setItem('pcd_isLoggedIn', 'true');
    
    // Se o usuário selecionou uma deficiência, salva a recomendação de filtro
    if (deficiencia) {
      localStorage.setItem('pcd_userDeficiencia', deficiencia);
      
      const adaptacaoRecomendada = mapearDeficienciaParaAdaptacao(deficiencia);
      if (adaptacaoRecomendada) {
         // Já deixa o filtro pré-selecionado para quando ele abrir a home
         localStorage.setItem('pcd_filtroRecomendado', adaptacaoRecomendada);
      }
    }

    alert("Perfil criado com sucesso! Redirecionando...");
    window.location.href = "home 1.html";
  }
</script>
</body>
</html>
